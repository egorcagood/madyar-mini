<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="1200" height="690" rx="28" fill="#07111c"/><g font-family="Arial,sans-serif" fill="#e7f6ff"><text x="48" y="62" font-size="32" font-weight="bold">Madyar Mini · логическая схема UART</text><text x="48" y="101" font-size="20" fill="#adc2d0">Обозначения сигналов, НЕ порядок контактных площадок на плате</text><rect x="55" y="145" width="310" height="335" rx="18" fill="#112333" stroke="#2ac6ef" stroke-width="2"/><rect x="825" y="145" width="310" height="335" rx="18" fill="#112333" stroke="#2ac6ef" stroke-width="2"/><text x="88" y="188" font-size="25">USB–UART · логика 3,3 В</text><text x="858" y="188" font-size="25">Своя плата ESP8266</text><g font-size="24"><text x="290" y="248">TXD</text><text x="290" y="311">RXD</text><text x="286" y="375">GND</text><text x="855" y="248">RX</text><text x="855" y="311">TX</text><text x="855" y="375">GND</text><text x="855" y="438">GPIO0</text></g><g fill="none" stroke-width="5"><path d="M365 240 H825" stroke="#35cbef"/><path d="M365 303 H825" stroke="#35cbef"/><path d="M365 367 H825 M650 367 V430 H825" stroke="#54d3a0"/></g><circle cx="650" cy="367" r="8" fill="#54d3a0"/><text x="405" y="225" font-size="18">передача → приём</text><text x="405" y="289" font-size="18">приём ← передача</text><text x="405" y="351" font-size="18">общая земля</text><text x="415" y="464" font-size="18" fill="#ffd782">GPIO0 → GND только для входа в загрузчик</text><text x="90" y="428" font-size="22" fill="#ffb66f">5V и 3V3: НЕ подключать</text><text x="58" y="530" font-size="23">Часы питаются через свой обычный USB. Провода меняйте только без питания.</text><text x="58" y="572" font-size="22" fill="#ffcf75">Для обычного запуска снимите GPIO0 → GND и перезапустите питание.</text><text x="58" y="615" font-size="20" fill="#adc2d0">Сначала определите площадки своей ревизии. Надёжные контакты + полный бэкап обязательны.</text><text x="58" y="650" font-size="19" fill="#adc2d0">GPIO2/GPIO15 должны соответствовать условиям загрузки ESP8266; схему платы не угадывайте.</text></g></svg>