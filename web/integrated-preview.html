<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Madyar Mini · 240 × 240</title>
<style>:root{color-scheme:dark}body{margin:0;padding:22px 15px;color:#dcedfa;background:#08111d;font:14px/1.5 "Segoe UI",sans-serif}h2{font-size:16px;font-weight:500;margin:0 0 16px;color:#9fb7cd}.screen{position:relative;width:240px;height:240px;margin:auto;box-shadow:0 0 45px #0d4f7025;border:1px solid #254254;border-radius:10px;overflow:hidden}canvas,img{display:block;width:240px;height:240px}img{position:absolute;inset:0}.screen img[hidden]{display:none}.info{margin:18px auto 0;max-width:280px;color:#9fb7cd}#state{color:#4bcafa}button{background:#0e2639;border:1px solid #28516b;color:#cfefff;padding:7px 12px;border-radius:8px;cursor:pointer;margin-top:12px}small{display:block;margin-top:10px;color:#7993ad}</style>
<style>#notice{position:absolute;inset:0;background:#020b12;border:1px solid #37c7ec;border-radius:10px;padding:15px 12px;overflow:hidden}#notice[hidden]{display:none}#notice h3{color:#43d3fa;font-size:13px;line-height:17px;margin:0 0 13px;font-weight:500}#plane{float:right;color:#41ceff;width:29px;height:27px;animation:fly 2.4s ease-in-out infinite}#sender{font-size:15px;font-weight:600;line-height:19px;height:38px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;overflow-wrap:anywhere;color:#edfbff}#message{font-size:17px;line-height:27px;height:108px;margin-top:8px;text-align:center;white-space:pre-wrap;overflow:hidden;color:#edfbff}#noticePage{position:absolute;bottom:10px;right:14px;font-size:11px;color:#40c8f4}@keyframes fly{0%,100%{transform:translate(0,-2px)}25%{transform:translate(3px,0)}50%{transform:translate(0,2px)}75%{transform:translate(-3px,0)}}</style>
<h2>Главный экран · 240 × 240</h2><div class="screen"><canvas id="home" width="240" height="240" aria-label="Время, погода, лимит Codex и вращающаяся M"></canvas><img id="animation" hidden alt="Утверждённая анимация статуса"><div id="notice" hidden><h3>Telegram <svg id="plane" viewBox="0 0 32 28" aria-hidden="true"><path fill="currentColor" d="M1 11 30 1 22 27 13 18 7 22 9 15Z"/><path fill="none" stroke="#05212f" stroke-width="1.5" d="m9 15 15-9-11 12"/></svg></h3><div id="sender"></div><div id="message"></div><div id="noticePage"></div></div></div>
<div class="info"><div id="state"></div><div id="source"></div><button id="motion" type="button">Остановить M</button><small>Локальная симуляция интерфейса. Скорость, цвет и память настоящего дисплея проверяются на устройстве.</small></div>
<script src="/renderer.js"></script><script>
(()=>{'use strict';let data=/* INITIAL */,elapsed=0,previous=null,motion=!matchMedia('(prefers-reduced-motion: reduce)').matches,updated=Date.now(),noticeUntil=0,noticeStarted=0,noticeId=null,pages=[''],page=-1,modeSince=Date.now();const renderer=MadyarHome.create(document.getElementById('home')),image=document.getElementById('animation'),button=document.getElementById('motion'),notice=document.getElementById('notice');
const measure=document.createElement('canvas').getContext('2d');measure.font='17px "Segoe UI",Arial,sans-serif';
function paginate(body){const lines=[];let line='';for(const word of body.split(/\s+/u)){if(!word)continue;let candidate=line?line+' '+word:word;if(measure.measureText(candidate).width<=210){line=candidate;continue;}if(line){lines.push(line);line='';}for(const ch of word){if(measure.measureText(line+ch).width>210&&line){lines.push(line);line='';}line+=ch;}}if(line)lines.push(line);const result=[];for(let i=0;i<lines.length;i+=4)result.push(lines.slice(i,i+4).join('\n'));return result.length?result:[''];}
function label(){const mode=data.mode||'HOME',c=data.codex||{};document.getElementById('state').textContent=({HOME:'Главный экран',WORKING:'Работают: '+c.working_count,WARNING:'Нужен ответ: '+(c.label||'Тест'),DONE:'Задачи завершены',DIAGNOSTIC:'Проверяем состояние'})[mode]||mode;document.getElementById('source').textContent=(data.weather?.available?'Погода получена. ':'Нет свежей погоды. ')+(data.usage?'Лимит получен.':'Лимит недоступен.');const src=['WORKING','WARNING','DONE'].includes(mode)?'/assets/status/'+mode.toLowerCase()+'.gif':null;if(src&&image.getAttribute('src')!==src)image.src=src;image.hidden=!src;button.textContent=motion?'Остановить M':'Включить M';}
button.onclick=()=>{motion=!motion;label();};function setData(value){if(data.mode!==value.mode)modeSince=Date.now();data=value;const p=data.palette||{};notice.style.background='linear-gradient(135deg,'+(p.background_from||'#020911')+','+(p.background_to||p.background_from||'#07304a')+')';notice.style.borderColor=p.frame||'#105070';updated=Date.now();noticeUntil=data.notice?updated+data.notice.ttl_ms:0;if(data.notice&&data.notice.id!==noticeId){noticeId=data.notice.id;noticeStarted=updated;pages=paginate(data.notice.body);page=-1;document.getElementById('sender').textContent=data.notice.title;}label();}setData(data);function frame(t){if(previous!==null&&motion&&!document.hidden)elapsed+=Math.min((t-previous)/1000,.15);previous=t;const cadence=data.animation||{enabled:true,seconds:3,interval_seconds:60},age=(Date.now()-modeSince)/1000;const replyActive=data.reply_ready?.id>0&&data.reply_ready.ttl_ms>Date.now()-updated&&['HOME','WORKING'].includes(data.mode);image.hidden=replyActive||!cadence.enabled||!['WORKING','WARNING','DONE'].includes(data.mode)||(data.mode!=='DONE'&&age%cadence.interval_seconds>=cadence.seconds);notice.hidden=!data.notice||Date.now()>=noticeUntil||['WARNING','DIAGNOSTIC'].includes(data.mode);if(!notice.hidden){const next=Math.floor((Date.now()-noticeStarted)/4000)%pages.length;if(next!==page){page=next;document.getElementById('message').textContent=pages[page];document.getElementById('noticePage').textContent=(page+1)+'/'+pages.length;}}const at=new Date((data.server_time_ms||updated)+Date.now()-updated);renderer.render(data,elapsed,at);requestAnimationFrame(frame);}requestAnimationFrame(frame);
globalThis.homePreview={renderer,setData,getData:()=>data,pause:()=>{motion=false;label();},renderAt:(iso,seconds)=>renderer.render(data,seconds,new Date(iso))};})();
</script></html>
